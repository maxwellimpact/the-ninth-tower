name: NinthTower
options:
  bundleIdPrefix: com.jonathancox
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  NinthTower:
    type: application
    platform: iOS
    sources:
      - path: NinthTower
        excludes:
          - Export
      # the art, sounds and data exported from the web build (tools/native-export.js + native-sync.mjs)
      - path: NinthTower/Export
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jonathancox.ninthtower
        PRODUCT_NAME: NinthTower
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "46QX82H573"
    info:
      path: NinthTower/Info.plist
      properties:
        CFBundleDisplayName: Ninth Tower
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: true
        UIRequiresFullScreen: true
        CADisableMinimumFrameDurationOnPhone: true
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.role-playing-games
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationLandscapeLeft
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationLandscapeLeft
